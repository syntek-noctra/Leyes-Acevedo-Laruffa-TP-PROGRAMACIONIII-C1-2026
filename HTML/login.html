<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validación de formulario — Bootstrap 5</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/CSS/styleLogin.css">
  </head>
  <body class="py-5">

    <div class="container" style="max-width: 540px">
      <a href="../index.html" class="btn btn-sm btn-outline-secondary mb-4">← Inicio</a>

      <h4 class="fw-bold mb-1 text-white">Validación de formulario</h4>
      <div class="card bg-dark text-white">
        <div class="card-body p-4">
          <form id="myForm" class="needs-validation" novalidate>

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input
                type="text"
                id="nombre"
                class="form-control"
                placeholder="Ej: Juan Pérez"
                required
                minlength="3"
              />
              <div class="valid-feedback">Se ve bien.</div>
              <div class="invalid-feedback">Ingresá al menos 3 caracteres.</div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="tu@email.com"
                required
              />
              <div class="valid-feedback">Email válido.</div>
              <div class="invalid-feedback">Ingresá un email válido.</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Mínimo 6 caracteres"
                required
                minlength="6"
              />
              <div class="valid-feedback">Contraseña aceptada.</div>
              <div class="invalid-feedback">Mínimo 6 caracteres.</div>
            </div>

          
            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
          </form>

          <div id="successMsg" class="alert alert-success mt-3 d-none">
            ¡Formulario enviado correctamente!
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      const form = document.getElementById('myForm')

      form.addEventListener('submit', (e) => {
        e.preventDefault()
        form.classList.add('was-validated')

        if (form.checkValidity()) {
          form.reset()
          form.classList.remove('was-validated')
          document.getElementById('successMsg').classList.remove('d-none')
        }
      })
    </script>
  </body>
</html>
